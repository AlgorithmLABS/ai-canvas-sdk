syntax = "proto3";

package aicanvas.customnode.v1;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

option go_package = "aicanvas/customnode/v1";
option java_package = "com.aicanvas.customnode.v1";
option java_outer_classname = "CustomNodeServiceProto";

// =============================================================================
// 서비스 정의
// =============================================================================

service CustomNodeExecutor {
  // 단일 노드를 즉시 응답과 함께 실행
  rpc ExecuteNode(NodeRequest) returns (NodeResponse);

  // 스트리밍 진행 업데이트와 함께 노드 실행
  rpc ExecuteNodeStream(NodeRequest) returns (stream NodeProgress);

  // 커스텀 노드 등록 및 검증
  rpc RegisterNode(NodeDefinition) returns (RegistrationResult);

  // 커스텀 노드 서버의 상태 확인
  rpc HealthCheck(HealthRequest) returns (HealthResponse);

  // 실행 중인 작업 취소
  rpc CancelExecution(CancelRequest) returns (CancelResponse);

  // 실행 상태 조회
  rpc GetExecutionStatus(StatusRequest) returns (ExecutionStatus);

  // 사용 가능한 커스텀 노드 목록 조회
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);

  // 커스텀 노드 삭제
  rpc DeleteNode(DeleteNodeRequest) returns (DeleteNodeResponse);
}

// =============================================================================
// 핵심 요청/응답 메시지
// =============================================================================

message NodeRequest {
  // 고유한 실행 식별자
  string execution_id = 1;

  // 노드 식별 정보
  string node_id = 2;
  string node_type = 3;
  string node_version = 4;

  // 입력 데이터 - 크기에 따른 하이브리드 방식
  repeated PortData direct_inputs = 5;    // 작은 데이터 (<1MB) 직접 전송
  repeated FileReference file_inputs = 6; // 큰 데이터 (≥1MB) 파일 경로를 통해 전송

  // 노드 파라미터
  map<string, ParameterValue> parameters = 7;

  // 실행 옵션 및 메타데이터
  ExecutionOptions options = 8;

  // 보안 컨텍스트
  SecurityContext security = 9;
}

message NodeResponse {
  string execution_id = 1;
  ExecutionStatus status = 2;

  // 출력 데이터
  repeated PortData direct_outputs = 3;
  repeated FileReference file_outputs = 4;

  // 실행 메타데이터
  ExecutionMetrics metrics = 5;
  repeated LogEntry logs = 6;

  // 오류 정보 (실패 시)
  ExecutionError error = 7;
}

// =============================================================================
// 스트리밍 메시지
// =============================================================================

message NodeProgress {
  string execution_id = 1;

  // 진행 정보
  float progress_percentage = 2;    // 0.0에서 100.0까지
  string status_message = 3;
  ProgressStage stage = 4;

  // 스트리밍 데이터
  LogEntry log_entry = 5;
  PartialResult partial_result = 6;
  ExecutionMetrics current_metrics = 7;

  // 타임스탬프
  google.protobuf.Timestamp timestamp = 8;
}

enum ProgressStage {
  STAGE_UNKNOWN = 0;        // 알 수 없음
  STAGE_INITIALIZING = 1;   // 초기화 중
  STAGE_LOADING_DATA = 2;   // 데이터 로딩 중
  STAGE_PROCESSING = 3;     // 처리 중
  STAGE_SAVING_RESULTS = 4; // 결과 저장 중
  STAGE_CLEANING_UP = 5;    // 정리 중
  STAGE_COMPLETED = 6;      // 완료
  STAGE_FAILED = 7;         // 실패
  STAGE_CANCELLED = 8;      // 취소됨
}

// =============================================================================
// 데이터 전송 메시지
// =============================================================================

message PortData {
  string port_id = 1;
  string port_name = 2;
  PortType port_type = 3;

  // 데이터 페이로드 (oneof로 하나만 설정 보장)
  oneof data {
    // 작은 데이터 타입
    string text_data = 4;
    bytes binary_data = 5;
    google.protobuf.Any json_data = 6;

    // 숫자 타입
    double number_data = 7;
    bool boolean_data = 8;

    // 구조화된 데이터 (작은 사이즈)
    StructuredData structured_data = 9;
  }

  // 메타데이터
  map<string, string> metadata = 10;
  int64 size_bytes = 11;
  string checksum = 12;
}

message FileReference {
  string port_id = 1;
  string port_name = 2;
  PortType port_type = 3;

  // 파일 정보
  string file_path = 4;        // 공유 볼륨의 경로
  string format = 5;           // parquet, arrow, csv, pickle, json 등
  int64 size_bytes = 6;
  string checksum = 7;         // SHA-256 해시
  CompressionType compression = 8;

  // 구조화된 데이터에 대한 스키마 정보
  DataSchema schema = 9;

  // 메타데이터
  map<string, string> metadata = 10;
  google.protobuf.Timestamp created_at = 11;
}

enum PortType {
  PORT_TYPE_UNKNOWN = 0;        // 알 수 없음
  PORT_TYPE_DATASET = 1;        // 데이터셋 (DataFrame)
  PORT_TYPE_UNTRAINED = 2;           // 학습 안된 모델
  PORT_TYPE_TRAINED = 3;         // 학습 된 모델
  PORT_TYPE_TRANSFORMER = 4;        // 트렌스포머
  PORT_TYPE_DISPLAY = 5;        // 시각화 디스플레이
  PORT_TYPE_SCORED_DATASET = 6; // 점수가 있는 데이터셋
  PORT_TYPE_JSON = 7;           // JSON 데이터
}

enum CompressionType {
  COMPRESSION_NONE = 0;    // 압축 없음
  COMPRESSION_GZIP = 1;    // GZIP 압축
  COMPRESSION_SNAPPY = 2;  // Snappy 압축
  COMPRESSION_LZ4 = 3;     // LZ4 압축
  COMPRESSION_ZSTD = 4;    // Zstandard 압축
}

// =============================================================================
// 파라미터 및 설정 메시지
// =============================================================================

message ParameterValue {
  oneof value {
    string string_value = 1;    // 문자열 값
    double number_value = 2;    // 숫자 값
    bool boolean_value = 3;     // 불리언 값
    google.protobuf.Any json_value = 4; // JSON 값
    bytes binary_value = 5;     // 바이너리 값
  }
}

message ExecutionOptions {
  // 타임아웃 설정
  google.protobuf.Duration timeout = 1;
  google.protobuf.Duration heartbeat_interval = 2;

  // 리소스 제한
  int64 max_memory_bytes = 3;
  int32 max_cpu_cores = 4;

  // 실행 옵션
  bool enable_streaming = 5;          // 스트리밍 사용
  bool enable_progress_reporting = 6; // 진행률 보고 사용
  bool enable_partial_results = 7;    // 부분 결과 사용

  // 멱등성 (Idempotency)
  string idempotency_key = 8;         // 멱등성 키
  bool enable_caching = 9;            // 캐싱 사용

  // 디버그 옵션
  bool debug_mode = 10;
  LogLevel log_level = 11;
}

message SecurityContext {
  string user_id = 1;
  string team_id = 2;
  repeated string permissions = 3;
  map<string, string> credentials = 4; // 암호화된 API 키, 토큰 등
}

// =============================================================================
// 실행 상태 및 메트릭
// =============================================================================

message ExecutionStatus {
  string execution_id = 1;
  ExecutionState state = 2;
  string status_message = 3;
  google.protobuf.Timestamp started_at = 4;   // 시작 시간
  google.protobuf.Timestamp completed_at = 5; // 완료 시간
  google.protobuf.Duration elapsed_time = 6;  // 경과 시간
}

enum ExecutionState {
  EXECUTION_STATE_UNKNOWN = 0;    // 알 수 없음
  EXECUTION_STATE_PENDING = 1;    // 대기 중
  EXECUTION_STATE_RUNNING = 2;    // 실행 중
  EXECUTION_STATE_SUCCESS = 3;    // 성공
  EXECUTION_STATE_FAILED = 4;     // 실패
  EXECUTION_STATE_CANCELLED = 5;  // 취소됨
  EXECUTION_STATE_TIMEOUT = 6;    // 타임아웃
}

message ExecutionMetrics {
  // 리소스 사용량
  int64 memory_used_bytes = 1;    // 사용 메모리 (바이트)
  int64 memory_peak_bytes = 2;    // 최대 메모리 (바이트)
  double cpu_usage_percent = 3;   // CPU 사용률 (%)

  // I/O 메트릭
  int64 bytes_read = 4;           // 읽은 바이트 수
  int64 bytes_written = 5;        // 쓴 바이트 수
  int32 files_read = 6;           // 읽은 파일 수
  int32 files_written = 7;        // 쓴 파일 수

  // 시간 메트릭
  google.protobuf.Duration initialization_time = 8; // 초기화 시간
  google.protobuf.Duration processing_time = 9;     // 처리 시간
  google.protobuf.Duration serialization_time = 10; // 직렬화 시간
  google.protobuf.Duration total_time = 11;         // 전체 시간

  // 커스텀 메트릭
  map<string, double> custom_metrics = 12;
}

// =============================================================================
// 로깅 및 오류 처리
// =============================================================================

message LogEntry {
  google.protobuf.Timestamp timestamp = 1;
  LogLevel level = 2;
  string message = 3;
  string logger_name = 4;
  string thread_name = 5;
  map<string, string> context = 6;

  // 예외 상세 정보 (해당하는 경우)
  ExceptionInfo exception = 7;
}

enum LogLevel {
  LOG_LEVEL_UNKNOWN = 0;   // 알 수 없음
  LOG_LEVEL_DEBUG = 1;     // 디버그
  LOG_LEVEL_INFO = 2;      // 정보
  LOG_LEVEL_WARNING = 3;   // 경고
  LOG_LEVEL_ERROR = 4;     // 오류
  LOG_LEVEL_CRITICAL = 5;  // 치명적 오류
}

message ExceptionInfo {
  string exception_type = 1;
  string exception_message = 2;
  repeated string stack_trace = 3;
  ExceptionInfo cause = 4; // 중첩된 예외
}

message ExecutionError {
  ErrorCode error_code = 1;
  string error_message = 2;
  string user_message = 3;     // 사용자 친화적 메시지
  ExceptionInfo exception = 4;
  map<string, string> error_context = 5;
  string recovery_suggestion = 6; // 복구 제안
}

enum ErrorCode {
  ERROR_CODE_UNKNOWN = 0;                   // 알 수 없는 오류
  ERROR_CODE_INVALID_INPUT = 1;             // 잘못된 입력
  ERROR_CODE_INVALID_PARAMETERS = 2;        // 잘못된 파라미터
  ERROR_CODE_NODE_NOT_FOUND = 3;            // 노드를 찾을 수 없음
  ERROR_CODE_EXECUTION_TIMEOUT = 4;         // 실행 타임아웃
  ERROR_CODE_INSUFFICIENT_RESOURCES = 5;    // 리소스 부족
  ERROR_CODE_PERMISSION_DENIED = 6;         // 권한 거부
  ERROR_CODE_DATA_SERIALIZATION_ERROR = 7;  // 데이터 직렬화 오류
  ERROR_CODE_FILE_NOT_FOUND = 8;            // 파일을 찾을 수 없음
  ERROR_CODE_NETWORK_ERROR = 9;             // 네트워크 오류
  ERROR_CODE_INTERNAL_ERROR = 10;           // 내부 오류
}

// =============================================================================
// 노드 등록 및 관리
// =============================================================================

message PortSchema {
  string type = 1;
  string position = 2;
  PortType port_type = 3;
  string label = 4;
  bool required = 5;                        // 필수 여부
}

message ParameterSchema {
  string text = 1;
  string name = 2;
  string form_type = 3;
  google.protobuf.Any value = 4;
  string value_type = 5;
  google.protobuf.Any mode = 6;
  google.protobuf.Any options = 7;                        
  bool is_tab = 8;   
}

message NodeData {
  repeated PortSchema input_ports = 1;
  repeated PortSchema output_ports = 2;
  repeated ParameterSchema params = 3;
}

message NodeDefinition {
  // 기본 정보
  string name = 1;
  NodeData data=2;
  string category = 3;
  int32 width = 4;
  int32 height = 5;
  string version = 6;

  // 메타데이터
  NodeMetadata metadata = 7;

  // 동적 노드 등록을 위한 소스 코드 (커스텀 노드용)
  string source_code = 8;          // Python 소스 코드
  string entry_class = 9;          // CustomNode 클래스 이름 (예: "HelloWorldNode")
  repeated string dependencies = 10; // 추가 pip 패키지 의존성 (예: ["pandas==2.0.0"])
}



// =============================================================================
// 데이터 스키마 및 구조
// =============================================================================

message DataSchema {
  SchemaType schema_type = 1;

  // 테이블 데이터에 대한 스키마 (DataFrame, CSV)
  repeated ColumnSchema columns = 2;

  // 일반적인 구조화된 데이터
  map<string, google.protobuf.Any> properties = 3;
}

enum SchemaType {
  SCHEMA_TYPE_UNKNOWN = 0;  // 알 수 없음
  SCHEMA_TYPE_TABULAR = 1;  // 테이블 데이터
  SCHEMA_TYPE_MODEL = 2;    // 모델 데이터
  SCHEMA_TYPE_IMAGE = 3;    // 이미지 데이터
  SCHEMA_TYPE_TEXT = 4;     // 텍스트 데이터
  SCHEMA_TYPE_JSON = 5;     // JSON 데이터
  SCHEMA_TYPE_BINARY = 6;   // 바이너리 데이터
}

message ColumnSchema {
  string name = 1;
  DataType data_type = 2;
  bool nullable = 3;                      // null 값 허용 여부
  google.protobuf.Any default_value = 4;  // 기본값
  string description = 5;
}

enum DataType {
  DATA_TYPE_UNKNOWN = 0;      // 알 수 없음
  DATA_TYPE_STRING = 1;       // 문자열
  DATA_TYPE_INTEGER = 2;      // 정수
  DATA_TYPE_FLOAT = 3;        // 실수
  DATA_TYPE_BOOLEAN = 4;      // 불리언
  DATA_TYPE_DATETIME = 5;     // 날짜/시간
  DATA_TYPE_CATEGORICAL = 6;  // 범주형
  DATA_TYPE_BINARY = 7;       // 바이너리
}


// =============================================================================
// 유틸리티 메시지
// =============================================================================

message StructuredData {
  repeated StructuredField fields = 1;
}

message StructuredField {
  string key = 1;   // 필드 키
  google.protobuf.Any value = 2; // 필드 값
}

message PartialResult {
  string result_id = 1;
  string result_type = 2;
  google.protobuf.Any result_data = 3;
  float completion_percentage = 4;        // 완료 비율
  google.protobuf.Timestamp timestamp = 5;
}

message NodeMetadata {
  string author = 1;                      // 제작자
  string license = 2;                     // 라이선스
  string documentation_url = 3;           // 문서 URL
  string source_code_url = 4;             // 소스코드 URL
  map<string, string> custom_metadata = 5;// 커스텀 메타데이터
  google.protobuf.Timestamp created_at = 6; // 생성 시간
  google.protobuf.Timestamp updated_at = 7; // 수정 시간
}

// =============================================================================
// 서비스 관리 메시지
// =============================================================================

message RegistrationResult {
  bool success = 1;                               // 성공 여부
  string message = 2;                             // 메시지
  string node_name = 3;                             // 등록된 노드 이름
  repeated ValidationError validation_errors = 4; // 유효성 검사 오류 목록
}

message ValidationError {
  string field = 1;         // 오류가 발생한 필드
  string error_code = 2;    // 오류 코드
  string error_message = 3; // 오류 메시지
}

message HealthRequest {
  bool include_details = 1; // 상세 정보 포함 여부
}

message HealthResponse {
  HealthStatus status = 1;
  string message = 2;
  map<string, string> details = 3;        // 상세 정보
  google.protobuf.Timestamp timestamp = 4;
}

enum HealthStatus {
  HEALTH_STATUS_UNKNOWN = 0;    // 알 수 없음
  HEALTH_STATUS_HEALTHY = 1;    // 정상
  HEALTH_STATUS_DEGRADED = 2;   // 성능 저하
  HEALTH_STATUS_UNHEALTHY = 3;  // 비정상
}

message CancelRequest {
  string execution_id = 1;
  bool force = 2;  // 즉시 취소 강제 실행
}

message CancelResponse {
  bool cancelled = 1; // 취소 성공 여부
  string message = 2;
}

message StatusRequest {
  string execution_id = 1;
  bool include_metrics = 2; // 메트릭 포함 여부
  bool include_logs = 3;    // 로그 포함 여부
}

message ListNodesRequest {
  string category = 1;        // 카테고리 필터
  int32 page = 2;             // 페이지 번호
  int32 page_size = 3;        // 페이지 사이즈
}

message ListNodesResponse {
  repeated NodeDefinition nodes = 1; // 노드 목록
  int32 total_count = 2;             // 전체 개수
  int32 page = 3;                    // 현재 페이지
  int32 page_size = 4;               // 페이지 사이즈
}

message DeleteNodeRequest {
  string node_name = 1;              // 삭제할 노드 이름 (필수)
  string version = 2;                // 삭제할 버전 (선택, 없으면 모든 버전 삭제)
  bool force = 3;                    // 기본 버전 삭제 강제 실행 또는 모든 버전 삭제
}

message DeleteNodeResponse {
  bool success = 1;                  // 성공 여부
  string message = 2;                // 메시지
  repeated string deleted_versions = 3; // 삭제된 버전 목록
}