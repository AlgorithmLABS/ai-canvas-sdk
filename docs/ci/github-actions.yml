# AI Canvas custom node 등록 (GitHub Actions) — Flow A push 모델 예시 템플릿
#
# 연결된 레포의 main 브랜치에 노드 폴더(<folder>/main.py + <folder>/req.txt)를 머지하면
# 변경된 top-level 노드 폴더만 backend 에 등록한다.
#
# 사전 준비 (admin '레포 연결' 발급값):
#   - 레포 Secrets 에 AI_CANVAS_CLIENT_ID / AI_CANVAS_CLIENT_SECRET 추가 (연결 생성 시 1회 노출)
#   - 아래 AI_CANVAS_BASE_URL 을 연결된 backend base URL 로 교체
#     (admin 페이지의 워크플로 생성 기능을 쓰면 base URL 이 채워진 본을 받을 수 있다)
#   - 재현성: 운영에서는 install 의 `@main` 을 릴리스 태그(`@vX.Y.Z`)로 고정 권장.
#   - github.event.before 가 all-zero(최초 push)면 CLI 가 모든 노드 폴더를 등록한다(upsert 라 안전).
#   - 아래 본문은 backend 의 워크플로 생성기 출력과 동일하게 유지된다(드리프트 테스트로 검증).
name: Register custom nodes
on:
  push:
    branches: [main]
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ai-canvas-sdk
        run: pip install "ai-canvas-sdk @ git+https://github.com/algorithmlabs/ai-canvas-sdk@main"
      - name: Register changed custom nodes
        env:
          AI_CANVAS_BASE_URL: "https://<your-ai-canvas-backend>"
          AI_CANVAS_CLIENT_ID: ${{ secrets.AI_CANVAS_CLIENT_ID }}
          AI_CANVAS_CLIENT_SECRET: ${{ secrets.AI_CANVAS_CLIENT_SECRET }}
        run: ai-canvas-sdk register --changed --base "${{ github.event.before }}" --head "${{ github.sha }}" --repo-root .
