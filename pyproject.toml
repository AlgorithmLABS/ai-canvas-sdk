[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-canvas-sdk"
dynamic = ["version"]
description = "SDK for developing custom nodes in AI Canvas platform"
requires-python = ">=3.10"
authors = [{ name = "AlgorithmLABS", email = "contact@algorithmlabs.co.kr" }]
dependencies = [
    # Keep runtime minimal; heavy data libs move to extras
    "grpcio>=1.75.0,<2.0.0",
    "protobuf>=6.32.1,<7.0.0",
    "pandas>=2.0,<3",
    "pyarrow>=21.0.0,<22.0.0",
    "numpy>=1.26.2,<2",
]

[project.optional-dependencies]


# Dev tooling for generating/stubbing protos, typing, etc.
dev = [
    "grpcio-tools>=1.75.0,<2.0.0",
    "grpc-stubs>=1.53.0.6,<2.0.0",
    "mypy-protobuf>=3.6.0,<4.0.0",
]

# Convenience: everything (data + dev)
all = [
    "pandas>=2.0,<3",
    "pyarrow>=21.0.0,<22.0.0",
    "numpy>=1.26.2,<2",
    "grpcio-tools>=1.75.0,<2.0.0",
    "grpc-stubs>=1.53.0.6,<2.0.0",
    "mypy-protobuf>=3.6.0,<4.0.0",
]

[project.urls]
Homepage = "https://github.com/algorithmlabs/ai-canvas-sdk"
Documentation = "https://github.com/algorithmlabs/ai-canvas-sdk/README.md"
"Bug Reports" = "https://github.com/algorithmlabs/ai-canvas-sdk/issues"

[project.scripts]
# CLI 명령어
ai-canvas-sdk = "ai_canvas_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*"]

[tool.setuptools_scm]
# 빌드 시 _version.py 자동 생성. tag 가 곧 패키지 버전.
# dev push 마다 v{base}.dev{N} 태그가 자동 생성되며, 그게 곧 설치 버전.
version_file = "ai_canvas_sdk/_version.py"
fallback_version = "0.0.0+unknown"
